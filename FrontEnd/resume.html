<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: rgb(189, 189, 169);
            border: 7px solid blueviolet;
        }
        .FPara{
            background-color:chartreuse
        }
        .box{
            width: 350px;
            height: 80px;
            background-color: #000;
            border: 3px solid rgb(248, 248, 0);
            border-radius: 10px;
            margin: 10px;
            position: relative;
            animation-name: RMove;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }

        @keyframes RMove{
            from{
                top: 0;
                left: 0;
            }
            to{
                top: 0;
                left: 1000px;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="box">
            
        </div>

        <div class="FPara">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum.</p>
        </div>

    </div>

</body>
</html>
