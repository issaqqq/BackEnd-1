<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="name">Name:</label>
    <input id="name" type="text"> <br/><br/>
    <label for="email">Email:</label>
    <input id="email" type="email"> <br/><br/>
    <label for="phone">Phone:</label>
    <input id="phone" type="tel"> <br/><br/>
    <label for="resume">Resume:</label>
    <input id="resume" type="file"> <br/><br/>
    <label for="">Experience(years):</label>
    <input type="number" min="0" max="50">

    <fieldset>
        <legend>Skills</legend>
        <label for="html">HTML:</label>
        <input type="checkbox" id="html"> <br><br>
        <label for="">CSS:</label>
        <input type="checkbox" id="css"><br><br>
        <label for="">JavaScript:</label>
        <input type="checkbox" id="js"><br><br>
    </fieldset><br>

    <label for="html">Highest Education:</label>
    <select id="selection">
        <option value="1">A</option>
        <option value="2">B</option>
        <option value="3">C</option>
        <option value="4">D</option>
    </select><br><br>
    
    <fieldset>
        <label for="html">Availability:</label><br>
    <label for="html">Full-Time:</label>
    <input type="radio" name="radio1" id="ft"> <br>
    <label for="html">Part-Time:</label>
    <input type="radio" name="radio1" id="pt">
    <br>
    </fieldset>

    <label for="">Additional Comments:</label><br>
    <textarea  ></textarea>
</body>
</html>
